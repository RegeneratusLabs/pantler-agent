name: consent
version: 0.1.0
manifest_version: 2
api_version: 1
author: pantler
license: MIT
requires_hermes: ">=0.22.5"
description: >-
  The pre-send gate for direct marketing: one decision per recipient from the consent
  records — allowed, no record, withdrawn, or ambiguous — plus the two draft checks, sender
  identification and an unsubscribe line. It refuses a send with no consent record.
tags: [consent, marketing, email, compliance, records]
provides_tools:
  - consent_check
config_schema:
  store_path:
    type: str
    default: ""
    description: >-
      Path to the records database the app writes, where consent records live. Defaults to
      records.db in HERMES_HOME, or PANTLER_STORE in the environment.
  packs_dir:
    type: str
    default: ""
    description: Directory holding the installed packs. Defaults to PANTLER_PACKS, or packs/ beside HERMES_HOME.
  custom_packs_dir:
    type: str
    default: ""
    description: >-
      Directory holding the operator's own record types, outside the distribution-owned packs/.
      Defaults to custom-packs/ beside the profile, or PANTLER_CUSTOM_PACKS.
