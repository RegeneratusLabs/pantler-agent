name: studio
version: 0.1.0
manifest_version: 2
api_version: 1
author: pantler
license: MIT
requires_hermes: ">=0.22.5"
description: >-
  The design studio: compose and measure a card, poster, sign, one-page site or brand sheet
  from a written brief, and render it as a self-contained SVG and an exact-size PNG. Every number — margins,
  type sizes, line breaks, contrast, safe zones — is computed here, not by the model. Also
  prepares the operator's own photographs and derives a brand kit from their answers.
tags: [design, brand, social, print, photos, render]
provides_tools:
  - design_templates
  - design_render
  - design_audit
  - design_brand
  - design_page
  - photo_prepare
config_schema:
  workspace_dir:
    type: str
    default: ""
    description: >-
      The active business's workspace. Every read and write this plugin makes is confined to
      it. Defaults to PANTLER_WORKSPACE, or workspace/ beside HERMES_HOME.
  fonts_dir:
    type: str
    default: ""
    description: >-
      Directory holding the licensed faces named in fonts.json. Defaults to fonts/ beside this
      plugin.
