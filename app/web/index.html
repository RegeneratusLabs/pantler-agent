<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#131414" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>pantler</title>
    <script>
      // Before first paint: apply the stored theme, so someone who chose light does not
      // get a flash of the dark canvas. Mirrors shell/theme.ts.
      try {
        var t = localStorage.getItem('pantler.theme')
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
