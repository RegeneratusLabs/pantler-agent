[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pantler-core"
version = "0.0.1"
description = "pantler's deterministic business logic: price book, ledger and document model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# No engine imports, ever. This package must stay portable so it can outlive the
# choice of agent engine (the design notes 1, "the seam").
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
